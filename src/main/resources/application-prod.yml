# ========================================
# PRODUCTION EC2 CONFIGURATION
# ========================================

server:
  port: 8077
  servlet:
    context-path: /api

spring:
  application:
    name: techxplore-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:devsupport}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate  # IMPORTANT: Use 'validate' in production, NOT 'update'
    show-sql: true  # IMPORTANT: Disable in production for performance
    open-in-view: false  # Prevent LazyInitializationException
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        generate_statistics: false

