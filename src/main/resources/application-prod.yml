  #elasticsearch.uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  #elasticsearch.connection-timeout: 5000
  #elasticsearch.socket-timeout: 60000

  # Disable auto-configurations not needed for production
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.opensearch.autoconfigure.OpenSearchVectorStoreAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

logging:
  level:
    root: WARN
    com.techxplore: INFO
    org.springframework.web: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /home/ec2-user/techxplore/logs/techxplore.log
    max-size: 10MB
    max-history: 30
    total-size-cap: 1GB

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      simple:
        enabled: true

# ========================================
# CORS CONFIGURATION (WebConfig.java uses this)
# ========================================
# For production EC2: React and Spring Boot run on same server
# React requests come from: https://yourdomain.com (via Nginx)
# Set ALLOWED_ORIGINS environment variable to your domain
#
# Example on EC2:
#   export ALLOWED_ORIGINS="https://yourdomain.com,https://www.yourdomain.com"
#   java -jar techxplorebackend-0.0.1-SNAPSHOT.jar --spring.profiles.active=prod
#
# Or in systemd service .env file:
#   ALLOWED_ORIGINS=http://3.219.240.227,https://yourdomain.com,https://www.yourdomain.com
#   SPRING_PROFILES_ACTIVE=prod
#
allowed:
  origins: ${ALLOWED_ORIGINS:http://3.219.240.227,http://localhost:3000,http://localhost:4200}
