logging:
  level:
    root: INFO
    org.springframework.web: DEBUG

# ========================================
# CORS CONFIGURATION (WebConfig.java uses this)
# ========================================
# For local development: localhost:3000, localhost:4200
allowed:
  origins: http://localhost:3000,http://localhost:4200,http://127.0.0.1:3000,http://127.0.0.1:4200
