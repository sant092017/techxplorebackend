# ========================================
# PRODUCTION EC2 CONFIGURATION
# ========================================

server:
  port: 8077
  servlet:
    context-path: /api

spring:
  application:
    name: techxplore-backend

  # ── Database ──────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:3.219.240.227}:${DB_PORT:5432}/${DB_NAME:devsupport}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  # ── JPA / Hibernate ───────────────────
  jpa:
    hibernate:
      ddl-auto: validate        # PROD: never auto-alter schema
    show-sql: false             # PROD: disable SQL logging for performance
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
          fetch_size: 50
        generate_statistics: false

  # ── Kafka (disabled for now) ──────────
  # kafka:
  #   bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  #   consumer:
  #     group-id: techxplore-prod-group
  #     auto-offset-reset: earliest
  #   producer:
  #     key-serializer: org.apache.kafka.common.serialization.StringSerializer
  #     value-serializer: org.apache.kafka.common.serialization.StringSerializer

  # ── Elasticsearch (disabled for now) ──
  # elasticsearch:
  #   uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  #   connection-timeout: 5s
  #   socket-timeout: 60s

  # ── OAuth2 (disabled for now) ─────────
  # security:
  #   oauth2:
  #     client:
  #       registration:
  #         auth0:
  #           client-id: ${AUTH0_CLIENT_ID}
  #           client-secret: ${AUTH0_CLIENT_SECRET}
  #           scope: openid,profile,email
  #           redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  #           authorization-grant-type: authorization_code
  #       provider:
  #         auth0:
  #           issuer-uri: https://YOUR_DOMAIN/.well-known/openid-configuration

  # ── Auto-configuration exclusions ─────
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.opensearch.autoconfigure.OpenSearchVectorStoreAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

# ── Logging ───────────────────────────────
logging:
  level:
    root: WARN
    com.techxplore: INFO        # PROD: only important app logs
    org.springframework.web: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /home/ec2-user/techxplore/logs/techxplore.log
    max-size: 10MB
    max-history: 30
    total-size-cap: 1GB

# ========================================
# SPRING BOOT ACTUATOR - HEALTH CHECK
# ========================================
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized  # PROD: only show details to authorized users
      show-components: always
  health:
    db:
      enabled: true             # Checks PostgreSQL connectivity
    diskspace:
      enabled: true             # Checks available disk space
    elasticsearch:
      enabled: false            # Explicitly disable Elasticsearch health check
    # kafka:
    #   enabled: true           # Uncomment when Kafka is configured
    # ssl:
    #   enabled: true           # Uncomment when SSL is configured
  info:
    env:
      enabled: true

# ── App info (exposed via /actuator/info) ─
info:
  app:
    name: TechXplore Backend
    version: 0.0.1-SNAPSHOT
    description: Backend API

# ========================================
# CORS CONFIGURATION
# ========================================
# Set ALLOWED_ORIGINS env variable on EC2:
#   export ALLOWED_ORIGINS="https://yourdomain.com"
#   java -jar techxplorebackend-0.0.1-SNAPSHOT.jar --spring.profiles.active=prod
allowed:
  origins: ${ALLOWED_ORIGINS:http://3.219.240.227,http://localhost:3000,http://localhost:4200}
